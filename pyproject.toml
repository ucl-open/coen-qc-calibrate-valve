[build-system]
requires = ["uv_build>=0.8.22"]
build-backend = "uv_build"

[project]
name = "coen-qc-calibrate-valve"
description = "The valve calibration's task schema, settings and test rigs, checked against the lab's open-rigs models."
license = "MIT"
requires-python = ">=3.13, <3.14"
version = "0.1.0"
dependencies = [
  "open-rigs",
  "pyyaml",
]

[project.scripts]
regenerate-schemas = "coen_qc_calibrate_valve.regenerate:main"

[dependency-groups]
dev = ["jsonschema>=4.26.0", "pytest"]

[tool.uv]
required-version = '>=0.8.4'

[tool.uv.sources]
# lib-open-rigs' update-workflows moves this pin.
open-rigs = {git = "https://github.com/Coen-Lab/lib-open-rigs", rev = "53529fc10536cc419a9e3a204e5dd1f979ffde84"}

[tool.pytest.ini_options]
testpaths = ["tests"]

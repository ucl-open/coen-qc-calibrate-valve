[project]
name = "coen-qc-calibrate-valve"
description = "The valve calibration's settings and test rigs, checked against the lab's open-rigs models."
license = "MIT"
requires-python = ">=3.11, <3.12"
version = "0.1.0"
dependencies = [
  "open-rigs",
  "pyyaml",
]

[dependency-groups]
dev = ["jsonschema>=4.26.0", "pytest"]

[tool.uv]
package = false

[tool.uv.sources]
# lib-open-rigs' update-workflows moves this pin.
open-rigs = {git = "https://github.com/Coen-Lab/lib-open-rigs", rev = "c3e5a2e2cacb8f2d04b0433cfa297a33b2812884"}

[tool.pytest.ini_options]
testpaths = ["tests"]

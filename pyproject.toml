[project]
name = "coen-qc-calibrate-valve"
description = "The valve calibration's settings and test rigs, checked against the lab's open-rigs models."
license = "MIT"
requires-python = ">=3.11, <3.12"
version = "0.1.0"
dependencies = [
  "open-rigs",
  "pyyaml",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.uv.sources]
# lib-open-rigs' update-workflows moves this pin.
open-rigs = {git = "https://github.com/Coen-Lab/lib-open-rigs", rev = "2a22fcaaafc921981ae9026a1b1a5bf37eec51a6"}
swc-aeon = { git = "https://github.com/SainsburyWellcomeCentre/aeon_api.git", branch = "main" }

[tool.pytest.ini_options]
testpaths = ["tests"]

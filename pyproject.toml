[project]
name = "coen-qc-calibrate-valve"
description = "The valve calibration's settings and test rigs, checked against the lab's open-rigs models."
license = "MIT"
requires-python = ">=3.11, <3.12"
version = "0.1.0"
dependencies = [
  "open-rigs",
  "pyyaml",
]

[dependency-groups]
dev = ["jsonschema>=4.26.0", "pytest"]

[tool.uv]
package = false

[tool.uv.sources]
# lib-open-rigs' update-workflows moves this pin.
open-rigs = {git = "https://github.com/Coen-Lab/lib-open-rigs", rev = "c40428102f3d84f20a2c14a13fc17b584d42f9f6"}

[tool.pytest.ini_options]
testpaths = ["tests"]

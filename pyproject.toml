[project]
name = "coen-qc-calibrate-valve"
description = "The valve calibration's settings and test rigs, checked against the lab's open-rigs models."
license = "MIT"
requires-python = ">=3.11, <3.12"
version = "0.1.0"
dependencies = [
  "open-rigs",
  "pyyaml",
]

[dependency-groups]
dev = ["jsonschema>=4.26.0", "pytest"]

[tool.uv]
package = false

[tool.uv.sources]
# lib-open-rigs' update-workflows moves this pin.
open-rigs = {git = "https://github.com/Coen-Lab/lib-open-rigs", rev = "5cc28d314eb3673c6ebe6abd1858f2a805371a8a"}

[tool.pytest.ini_options]
testpaths = ["tests"]

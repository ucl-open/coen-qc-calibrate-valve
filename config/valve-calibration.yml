# yaml-language-server: $schema=../.venv/Lib/site-packages/open_rigs/schemas/calibration.json#/$defs/DispenseCalibration
# Settings of the valve calibration (OpenRigs.Core DispenseCalibration's form), read at Start by
# src\main.bonsai for the bursts and by app-rig-control for the fit (densityGPerMl).
# The fit is app-rig-control's Python (a LinearFit), never Bonsai's. The valves' lines, the board's port
# and the stage come from the rig's own rig.yml; the run's valves and file name from app-rig-control's
# launch; never from here.
#
# The balance is read by app-rig-control (OpenRigs.Devices ManualBalance): after each burst the run asks for
# the weight and waits up to weighTimeoutSeconds for app-rig-control to send it, read off the camera or typed,
# taking that one reading (settleReadings 1).
# Each sample fires its `pulses` pulses of `pulseWidthMs`, then weighs the gain. Seven widths, closer
# together at the short end: 20, 25, 30, 40, 50, 70 and 100 ms, each measured twice (Pip, 9 Nov 2026: "just do 2 repeats, not 3, for now"), in rounds of
# all seven, each round shuffled anew every run (Pip, 11 Nov 2026: "Shuffle every round"; the order
# below is ignored, round k being each width's k-th sample), so drift over the run falls on
# every width alike; each burst is a point of the curve, so a line fitted to it (LinearFit) averages the rounds. Every burst delivers about what 600
# pulses at 20 ms do, taking volume as proportional to width: 600 at 20 ms, 480 at 25, 400 at 30,
# 300 at 40, 240 at 50, 171 at 70 and 120 at 100 (Pip, 6 Nov 2026: 500 at 20 ms; 9 Nov 2026: "increase
# delivery total volume by 25% (to a rounded number near that)", so +20%). pulseGapMs is the
# off-to-on time between pulses, 80 ms (Pip, 11 Nov 2026: "increase the time between
# clicks"; the valves over-delivered 12 to 27% against their curves). Every sample takes the same
# one: the calibration file records it and a rig fires its rewards at it, so the workflow refuses
# samples at different gaps. Pulses are timed on the behavior board's Harp clock (OpenRigs.Core
# FirePulses), and main.bonsai logs each as the board fired it. Before each
# weighing, app-rig-control fires drips of the same width until the balance moves (a drop can hang on
# the spout); they are added to that burst's pulses in the weights file (Pip, 8 Nov 2026).
# The widths are written for a 20 ms minimum: at Go they are scaled so the smallest is the rig's
# minPulseWidthMs, the task file's (config\task-valve.yml, which app-rig-control writes), the largest 5 times it; the pulses stay as
# written (Pip, 12 Nov 2026: "Max opening should be 5 x min, so all just scale").
procedure:
  samples:
    - { pulseWidthMs: 40, pulses: 300, pulseGapMs: 80 } # round 1
    - { pulseWidthMs: 30, pulses: 400, pulseGapMs: 80 }
    - { pulseWidthMs: 50, pulses: 240, pulseGapMs: 80 }
    - { pulseWidthMs: 25, pulses: 480, pulseGapMs: 80 }
    - { pulseWidthMs: 100, pulses: 120, pulseGapMs: 80 }
    - { pulseWidthMs: 20, pulses: 600, pulseGapMs: 80 }
    - { pulseWidthMs: 70, pulses: 171, pulseGapMs: 80 }
    - { pulseWidthMs: 25, pulses: 480, pulseGapMs: 80 } # round 2
    - { pulseWidthMs: 20, pulses: 600, pulseGapMs: 80 }
    - { pulseWidthMs: 100, pulses: 120, pulseGapMs: 80 }
    - { pulseWidthMs: 70, pulses: 171, pulseGapMs: 80 }
    - { pulseWidthMs: 40, pulses: 300, pulseGapMs: 80 }
    - { pulseWidthMs: 30, pulses: 400, pulseGapMs: 80 }
    - { pulseWidthMs: 50, pulses: 240, pulseGapMs: 80 }
  xName: pulse_width
  primingPulses: 5
  primingPulseWidthMs: 500 # ms each, so the line is full before the baseline (Pip); unset is the largest sample's
  densityGPerMl: 1.0
  settleReadings: 1
  weighTimeoutSeconds: 3600

# A dome's rig.yml, the parts the valve calibration reads (lib-open-rigs' building-blocks example):
# two reward valves, the Zapit trigger on DO3, the timestamp generator and the lick spout stage's
# two drivers.
behaviorBoard:
  main:
    portName: COM3
    usbSerial: AB0M7PLB
    pulseController:
      outputPulseEnable: "DO1, DO2"
      outputs:
        DO1: { discriminatorType: CalibratedPulse, artefact: calibration/RewardValve-Left.json }
        DO2: { discriminatorType: CalibratedPulse, artefact: calibration/RewardValve-Right.json }
        DO3: { discriminatorType: FixedPulse, pulseWidthMs: 0 }
    wiring:
      DO0: { device: CameraTrigger, targets: [Camera-Face, Camera-Pupil, Camera-Body] }
      DO1: { device: RewardValve, name: left }
      DO2: { device: RewardValve, name: right }
      DO3: { device: ZapitTrigger, note: also the masking light }
timestampGeneratorGen3:
  main: { portName: COM4, timerFrequency: Timer1000Hz }
stepperDriver:
  a: { portName: COM5, usbSerial: AB0AAAAA }
  b: { portName: COM6, usbSerial: AB0BBBBB }
lickSpoutDefaultPosition: { baseTransverse: 1000, radialLeft: 2000, radialRight: 2000, elevationLeft: 3000, elevationRight: 3000 }
zapit: { host: 127.0.0.1, port: 1488, hardwareTriggered: true }
rootPath: C:\Coen-Lab-Local\Acquired-Data

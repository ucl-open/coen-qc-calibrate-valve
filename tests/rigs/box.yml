# A behaviour box's rig.yml (BBOX-1's, 13 Nov 2026) with one reward valve wired on DO1: what
# the valve calibration reads from a box. Its camera and wheel are read by no part of it.
behaviorBoard:
  main:
    cameraTriggerController:
      trigger0Frequency: 50
      trigger1Frequency: 50
    portName: COM3
    usbSerial: 'AB0M7PLB'
    pulseController:
      outputPulseEnable: DO1
      outputs:
        DO1: { discriminatorType: CalibratedPulse, artefact: calibration/valve-DO1.json }
        DO2: { discriminatorType: FixedPulse, pulseWidthMs: 0 }
        DO3: { discriminatorType: FixedPulse, pulseWidthMs: 0 }
    runningWheel:
      countsPerRev: 4096
      wheelDiameterMm: 150.0
    wiring:
      DO0: { device: CameraTrigger, targets: [Camera-Overhead] }
      DO1: { device: RewardValve, side: left }
camera:
  overhead:
    binning: 1
    discriminatorType: SpinnakerCamera
    exposureTime: 3000.0
    gain: 1.0
    pixelFormat: Mono8
    serialNumber: '23201539'
rigId: S1
rootPath: C:\Coen-Lab-Local\Acquired-Data

# A rig.yml with a behavior board and nothing else, as the valve calibration reads it: two reward
# valves and a photodiode line, no timestamp generator and no lick spout stage. The workflows run
# on any board with RewardValve wiring; dome.yml is the rig with everything.
behaviorBoard:
  main:
    portName: COM4
    usbSerial: 'AB0M7XYZ'
    pulseController:
      outputPulseEnable: DO1, DO2
      outputs:
        DO1: { discriminatorType: CalibratedPulse, artefact: calibration/valve-DO1.json }
        DO2: { discriminatorType: CalibratedPulse, artefact: calibration/valve-DO2.json }
        DO3: { discriminatorType: FixedPulse, pulseWidthMs: 0 }
    wiring:
      DO1: { device: RewardValve, side: left }
      DO2: { device: RewardValve, side: right }
      DO3: { device: Photodiode }
rootPath: C:\Coen-Lab-Local\Acquired-Data
